[package]
edition = "2024"
name = "st-ball-detection"
version = "0.1.1"
license = "MIT OR Apache-2.0"

[dependencies]
# https://docs.embassy.dev/embassy-time/git/default/index.html
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

# https://docs.embassy.dev/embassy-stm32/git/stm32l4s5vi/index.html
embassy-stm32 = { version = "0.4.0", features = ["defmt", "unstable-pac", "stm32l4s5vi", "memory-x", "time-driver-any", "exti", "chrono", "dual-bank"]}

# https://docs.embassy.dev/embassy-executor/git/cortex-m/index.html
# Need to downgrade the embassy-executor until the newest version is release: https://github.com/embassy-rs/embassy/issues/4511
embassy-executor = { version = "0.9.0", features = ["defmt", "arch-cortex-m", "executor-thread"] }


# Additional crates used in the online examples
embassy-sync = { version = "0.7.2", features = ["defmt"]}
embassy-embedded-hal = { version = "0.5.0" }
# embassy-usb = { version = "0.5.0", features = ["defmt"]}
embassy-futures = { version = "0.1.2" }

# Additional embedded crates
embedded-io-async = { version = "0.6.1", features = ["defmt-03"] }
embedded-io ={ version = "0.6.0", features = []}

# Formatting crates referenced by the other dependencies
defmt = "1.0.1"
defmt-rtt = "1.0.0"

# Standard Embassy Crates
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

embedded-hal = "0.2.6"
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-hal-bus = { version = "0.1", features = ["async"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = { version = "0.8", default-features = false }
chrono = { version = "^0.4", default-features = false }
static_cell = "2"

micromath = "2.0.0"

[profile.release]
debug = 2
